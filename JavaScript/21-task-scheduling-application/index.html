
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Scheduling Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app">
        <header>
            <h1>My Task Planner</h1>
            <p>Organize your work, manage deadlines and track your progress.</p>
        </header>

        <section class="task-form">
            <h2>Add a New Task</h2>

            <form id="task-form">
                <div class="form-group">
                    <label for="task-name">Task name</label>
                    <input type="text" id="task-name"
                        placeholder="What do you need to do?" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="task-date">Deadline</label>
                        <input type="date" id="task-date" required>
                    </div>

                    <div class="form-group">
                        <label for="task-priority">Priority</label>
                        <select id="task-priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="add-button">Add Task</button>
            </form>
        </section>

        <section class="statistics">
            <div class="stat-card">
                <span id="total-count">0</span>
                <small>Total Tasks</small>
            </div>

            <div class="stat-card">
                <span id="completed-count">0</span>
                <small>Completed</small>
            </div>

            <div class="stat-card">
                <span id="pending-count">0</span>
                <small>Pending</small>
            </div>

            <div class="stat-card">
                <span id="progress-value">0%</span>
                <small>Progress</small>
            </div>
        </section>

        <section class="progress-section">
            <div class="progress-heading">
                <h2>Overall Progress</h2>
                <span id="progress-label">0%</span>
            </div>

            <div class="progress-track">
                <div id="progress-bar"></div>
            </div>
        </section>

        <section class="task-section">
            <div class="task-heading">
                <h2>My Tasks</h2>

                <select id="filter-tasks">
                    <option value="all">All Tasks</option>
                    <option value="pending">Pending</option>
                    <option value="completed">Completed</option>
                </select>
            </div>

            <div id="task-list"></div>

            <p id="empty-message">No tasks yet. Add your first task above!</p>
        </section>

        <footer>
            <p>Task Planner | Stay organized and keep moving forward.</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
