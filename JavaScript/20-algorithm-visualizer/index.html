
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algorithm Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <h1>Sorting Algorithm Visualizer</h1>
            <p>Watch different sorting algorithms organize an array.</p>
        </header>

        <section class="controls">
            <div class="control-group">
                <label for="algorithm">Choose algorithm</label>
                <select id="algorithm">
                    <option value="bubble">Bubble Sort</option>
                    <option value="selection">Selection Sort</option>
                    <option value="insertion">Insertion Sort</option>
                </select>
            </div>

            <div class="control-group">
                <label for="array-size">Array size: <span id="size-value">25</span></label>
                <input type="range" id="array-size" min="5" max="60" value="25">
            </div>

            <div class="control-group">
                <label for="speed">Animation speed</label>
                <select id="speed">
                    <option value="500">Slow</option>
                    <option value="200" selected>Normal</option>
                    <option value="50">Fast</option>
                </select>
            </div>
        </section>

        <section class="buttons">
            <button id="generate-button">Generate New Array</button>
            <button id="sort-button">Start Sorting</button>
        </section>

        <section class="statistics">
            <div>
                <span id="comparisons">0</span>
                <small>Comparisons</small>
            </div>

            <div>
                <span id="swaps">0</span>
                <small>Swaps / Moves</small>
            </div>

            <div>
                <span id="status">Ready</span>
                <small>Status</small>
            </div>
        </section>

        <section class="visualization">
            <div id="array-container"></div>
        </section>

        <section class="legend">
            <span><i class="normal"></i> Unsorted</span>
            <span><i class="active"></i> Comparing</span>
            <span><i class="sorted"></i> Sorted</span>
        </section>

        <footer>
            <p>Algorithm Visualizer | Learning Data Structures and Algorithms</p>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
